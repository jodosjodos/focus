services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-focus}
      POSTGRES_USER: ${POSTGRES_USER:-focus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-focus}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - focus_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-focus} -d ${POSTGRES_DB:-focus}']
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./apps/backend
    restart: unless-stopped
    env_file:
      - ./apps/backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-focus}:${POSTGRES_PASSWORD:-focus}@postgres:5432/${POSTGRES_DB:-focus}
    ports:
      - '${BACKEND_PORT:-3000}:3000'
    volumes:
      - ./apps/backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "pnpm install --frozen-lockfile && pnpm start:dev"

  mobile-metro:
    build:
      context: ./apps/mobile
    restart: unless-stopped
    environment:
      EXPO_PACKAGER_HOSTNAME: ${LAN_IP}
      EXPO_PUBLIC_API_HOST: ${LAN_IP}
    ports:
      - '8081:8081'
    volumes:
      - ./apps/mobile:/app
      - ./apps/mobile/node_modules:/app/node_modules
      - pnpm_store:/root/.local/share/pnpm/store
    command: sh -c "pnpm install --frozen-lockfile && exec npx expo start --dev-client --host lan"

volumes:
  focus_pgdata:
  backend_node_modules:
  pnpm_store:
